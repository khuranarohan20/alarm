[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "textual>=0.47",
    "rich>=13",
]

[project.scripts]
alarm = "alarm.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
